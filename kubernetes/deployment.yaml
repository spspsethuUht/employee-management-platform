apiVersion: apps/v1

kind: Deployment

metadata:
  name: employee-app
  namespace: employee

spec:

  replicas: 1

  selector:
    matchLabels:
      app: employee

  template:

    metadata:
      labels:
        app: employee

    spec:

      containers:

      - name: employee

        image: employee-service:v2

        imagePullPolicy: Never

        ports:
        - containerPort: 8080
