apiVersion: apps/v1

kind: Deployment

metadata:
  name: employee-app
  namespace: employee

spec:
  replicas: 1

  selector:
    matchLabels:
      app: employee

  template:

    metadata:
      labels:
        app: employee

    spec:

      containers:

      - name: employee

        image: employee-service:v2

        imagePullPolicy: Never

        ports:
        - containerPort: 8080

        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3

        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
